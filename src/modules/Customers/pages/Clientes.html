<link rel="stylesheet" href="/src/modules/Customers/components/customer-add-modal/customer-add.css">
<link rel="stylesheet" href="/src/modules/Customers/components/customer-edit-modal/customer-edit.css">
<link rel="stylesheet" href="/src/modules/Customers/components/customer-delete-modal/customer-delete.css">
<link rel="stylesheet" href="/src/modules/Customers/pages/Clientes.css">

<div class="header">
  <h1>Gestión de Clientes</h1>
  <p>Consulta y administra la información de tus clientes.</p>
</div>

<div class="card">
  <div class="top-bar">
    <input type="text" placeholder="Buscar cliente...">
    <div class="actions">
      <select id="filtroEstado">
        <option value="">Todos los clientes</option>
        <option value="true">Activos</option>
        <option value="false">Inactivos</option>
      </select>
      <button id="btnNuevoCliente" class="btn-new" type="button">
        <span class="icon">+</span> Nuevo Cliente
      </button>
    </div>
  </div>
  <div class="table-wrapper">
    <table>
      <thead>
        <tr>
          <th>Nombre</th><th>Apellido</th><th>Teléfono</th>
          <th>Cédula</th><th>Dirección</th><th>Estado</th><th>Acciones</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>
  <div class="table-footer">
    <span>Mostrando 1 a 3 de 25 clientes</span>
    <div class="pagination">
      <button>&lt;</button><button class="active">1</button>
      <button>2</button><button>3</button><button>&gt;</button>
    </div>
  </div>
</div>

<div id="modal-container"></div>
<script type="module" src="/src/modules/Customers/pages/Clientes.js"></script>

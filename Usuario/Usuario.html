<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Pasteleria Soto</title>
    <link rel="stylesheet" href="Usuario.css">
    <link rel="stylesheet" href="/Components/global.css">
</head>
<body>

    <input type="checkbox" id="user-modal" class="modal-toggle">

    <div class="modal-overlay">
        <div class="modal-content">

            <div class="modal-header">
                <h2>Nuevo Usuario</h2>
                <label for="user-modal" class="close">×</label>
            </div>

            <div class="modal-body">
                <div class="form-group">
                 <p>Nombre</p>
                 <input type="text" placeholder>
                </div>

                <div class="form-group">
                 <p>Rol</p>
                  <select>
                     <option>Administrador</option>
                     <option>Cajero</option>
                   </select>
                </div>

                <div class="form-group">
                 <p>Estado</p>
                   <select>
                     <option>Activo</option>
                     <option>Inactivo</option>
                   </select>
                </div>

            </div>

            <div class="modal-footer">
                <label for="user-modal" class="btn-cancel">Cancelar</label>
                <button class="btn-save">Guardar</button>
            </div>

        </div>
    </div>

    <div class="container">

        <!-- SIDEBAR -->
        <div id="sidebar-container"></div>

        <!-- MAIN -->
        <main class="main">

                <!-- TOPBAR -->
                <div id="topbar-container"></div>

            <!-- HEADER -->
            <div class="header">
                <h1>Gestión de Usuarios</h1>
                <p>Administra la informacion de los usuarios.</p>
            </div>

            <!-- CONTENIDO -->
            <div class="card">

                <!-- BARRA SUPERIOR -->
                <div class="top-bar">
                    <div class="search-box">
                        <input type="text" placeholder="Buscar Usuario...">
                        <img src="/Assets/img/lupa.png" class="search-icon">
                    </div>
                    

                    <div class="actions">
                        <select>
                            <option>Todos los Usuarios</option>

                        </select>
                        
                        <label for="user-modal" class="btn-new">+ Nuevo Usuario</label>

                    </div>
                </div>

                <!-- TABLA -->
                <table>
                    <thead>
                        <tr>
                            <th>Usuario</th>
                            <th>Rol</th>
                            <th> Estado</th>
                            <th> Acciones </th> 

                        </tr>
                    </thead>

                    <tbody>
                        <tr>
                            <td >Admin Soto</td>
                            <td>Administrador</td>
                            <td> 
                            <button class="Activo">Activo</button>
                            </td>
                            <td>
                                <div class="actions">
                                    <button class="edit">
                                        <img src="/Assets/img/editar.png">
                                        Editar
                                    </button>
                                    <button class="delete">
                                        <img src="/Assets/img/eliminar-usuario.png">
                                        Eliminar
                                    </button>
                                </div>
                            </td>
                        </tr>

                        <tr>
                            <td >Yahir Lopez</td>
                            <td>Cajero</td>
                            <td> 
                            <button class="Activo">Activo</button>
                            </td>
                        
                            <td>
                                <div class="actions">
                                    <button class="edit">
                                       <img src="/Assets/img/editar.png">
                                        Editar
                                    </button>
                                    <button class="delete">
                                        <img src="/Assets/img/eliminar-usuario.png">
                                        Eliminar
                                    </button>
                                </div>
                            </td>
                        </tr>

                        <tr>
                            <td >Alison Villa</td>
                            <td>Cajero</td>
                            <td> 
                            <button class="Activo"> Activo</button>
                            </td>
                            
                            <td>
                            <div class="actions">
                                    <button class="edit">
                                        <img src="/Assets/img/editar.png">
                                        Editar
                                    </button>
                                    <button class="delete">
                                        <img src="/Assets/img/eliminar-usuario.png">
                                        Eliminar
                                    </button>
                                </div>
                            
                            </td>
                        </tr>
                        <tr>
                            <td >Jafet Sanchez</td>
                            <td>Cajero</td>
                            <td> 
                            <button class="Activo">Activo</button>
                            </td>
                            
                            <td>
                                <div class="actions">
                                    <button class="edit">
                                        <img src="/Assets/img/editar.png">
                                        Editar
                                    </button>
                                    <button class="delete">
                                        <img src="/Assets/img/eliminar-usuario.png">
                                        Eliminar
                                    </button>
                                </div>
                            </td>
                        </tr>
                    </tbody>
                </table>

                <!-- FOOTER -->
                <div class="table-footer">
                    <span>Mostrando Usuarios 1/1</span>

                    <div class="pagination">
                        <button>&lt;</button>
                        <button class="active">1</button>
                        <button>&gt;</button>
                    </div>
                </div>

            </div>

        </main>

    </div>
     <script src="/JS/components.js"></script>

</body>
</html>

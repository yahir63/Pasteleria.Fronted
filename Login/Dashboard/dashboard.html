<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pastelería Soto</title>
    <link rel="stylesheet" href="dashboard.css">
    <link rel="stylesheet" href="/Components/global.css">
</head>

<body>

<div class="container">

    <!-- SIDEBAR GLOBAL -->
    <div id="sidebar-container"></div>
   
   

    <main class="main">


        <!-- TOPBAR GLOBAL -->
        <div id="topbar-container"></div>

        <header class="header">
            <h1>¡Bienvenido de vuelta! </h1>
            <p>Aquí tienes un resumen de tu pastelería hoy.</p>
        </header>

    
       <section class="dashboard-top">
    <!-- Imagen del banner -->
    <div class="banner-wrapper">
        <section class="banner">
            <div class="banner-text">
            </div>
        </section>
    </div>

    <!-- Panel de widgets derecho  -->
    <aside class="widgets-panel">
        
        <!-- Widget: Pedidos del día -->
        <div class="widget-card">
            <div class="widget-header">
                <h3><img src="/Assets/img/pastel.png" alt="pedidos" style="width:18px;vertical-align:middle;"> Pedidos de hoy</h3>
                <span class="widget-badge">3 activos</span>
            </div>
            <ul class="widget-list">
                <li class="widget-item">
                    <span class="item-dot dot-blue"></span>
                    <span class="item-name">Pastel de chocolate</span>
                    <span class="item-time">14:00</span>
                </li>
                <li class="widget-item">
                    <span class="item-dot dot-orange"></span>
                    <span class="item-name">Cupcakes x24</span>
                    <span class="item-time">16:30</span>
                </li>
                <li class="widget-item">
                    <span class="item-dot dot-green"></span>
                    <span class="item-name">Tarta de frutas</span>
                    <span class="item-time">18:00</span>
                </li>
            </ul>
        </div>

        <!-- Widget: Meta de ventas -->
        <div class="widget-card">
            <div class="widget-header">
                <h3><img src="/Assets/img/carro.png" alt="ventas" style="width:18px;vertical-align:middle;"> Meta de ventas</h3>
            </div>
            <div class="widget-progress">
                <div class="progress-row">
                    <div class="progress-label"><span>Hoy</span><strong>$8,560</strong></div>
                    <div class="progress-bg"><div class="progress-fill" style="width:72%;"></div></div>
                </div>
                <div class="progress-row">
                    <div class="progress-label"><span>Semana</span><strong>$32,400</strong></div>
                    <div class="progress-bg"><div class="progress-fill fill-green" style="width:65%;"></div></div>
                </div>
            </div>
        </div>
    </aside>
</section>

<!-- CARDS -->
<section class="cards">
    <div class="card">
        <div class="card-icon">
            <img src="/Assets/img/pastel.png" alt="Pedidos">
        </div>
        <div class="card-info">
            <h3>Pedidos hoy</h3>
            <p class="number">24</p>
        </div>
    </div>

    <div class="card">
        <div class="card-icon">
            <img src="/Assets/img/carro.png" alt="Ventas">
        </div>
        <div class="card-info">
            <h3>Ventas hoy</h3>
            <p class="number">$8,560</p>
        </div>
    </div>

    <div class="card">
        <div class="card-icon">
            <img src="/Assets/img/caja.png" alt="Productos">
        </div>
        <div class="card-info">
            <h3>Productos</h3>
            <p class="number">56</p>
        </div>
    </div>

    <div class="card">
        <div class="card-icon">
            <img src="/Assets/img/avatar.png" alt="Clientes">
        </div>
        <div class="card-info">
            <h3>Clientes</h3>
            <p class="number">128</p>
        </div>
    </div>
</section>

</div>

<!-- JS -->
<script src="/JS/components.js"></script>

</body>
</html>

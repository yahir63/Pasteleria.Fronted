<div id="modalEditOpcion" class="modal">
  <div class="modal-content">
    <span id="close-edit-opcion">✕</span>
    <h2>Editar Opción</h2>

    <label for="edit-opcion-nombre">Nombre</label>
    <input type="text" id="edit-opcion-nombre" placeholder="Nombre de la opción" />

    <label for="edit-opcion-descripcion">Descripción</label>
    <input type="text" id="edit-opcion-descripcion" placeholder="Descripción" />

    <label for="edit-opcion-medida">Medida</label>
    <input type="text" id="edit-opcion-medida" placeholder="Ej: kg, unidad, litro" />

    <label for="edit-opcion-precio">Precio</label>
    <input type="number" id="edit-opcion-precio" placeholder="0.00" min="0" step="0.01" />

    <div class="modal-actions">
      <button type="button" class="btn cancel" id="btn-cancel-edit-opcion">Cancelar</button>
      <button type="button" class="btn save" id="btn-save-edit-opcion">Actualizar</button>
    </div>
  </div>
</div>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pasteleria Soto</title>
    <link rel="stylesheet" href="login.css">
</head>
<body>
    <div class="main-card">
    
    <div class="form-side">
        <h1>Bienvenidos</h1>

        <div class="input-field">
            <label>Usuario</label>
            <input id="username" type="text" placeholder="Tu usuario">
            <i class="fas fa-user"></i>
        </div>

        <div class="input-field">
            <label>Contraseña</label>
            <input id="password" type="password" placeholder="Tu contraseña">
            <i class="fas fa-lock"></i>
        </div>
                <a href="Dashboard/dashboard.html">
                     <button class="signup-btn" onclick="login()">Ingresar</button>
                    <p class="footer-text">Se te olvido tu contraseña?</p>
                </a>
                    <script>
        // Credenciales fijas (lógica quemada)
        const USER = "admin";
        const PASS = "1234";

        function login() {
            const userInput = document.getElementById("username").value.trim();
            const passInput = document.getElementById("password").value.trim();
            const errorMsg = document.getElementById("error-msg");

            // Validación simple
            if (userInput === USER && passInput === PASS) {
                alert("✅ Login exitoso");
                // Aquí podrías redirigir a otra página
                // window.location.href = "dashboard.html";
            } else {
                errorMsg.textContent = "❌ Usuario o contraseña incorrectos";
            }
        }
    </script>




   
    </div>

    
          
    <div class="image-side">
        <div class="image-container">
            <img src="https://media.easy-peasy.ai/9a7627ad-75b9-4d23-b767-3ece2e4a625f/17485dd7-a4e0-4534-9ec1-da47d1e984d2.png" alt="pastel">
        </div>
    </div>

</div>
    
</body>
</html>

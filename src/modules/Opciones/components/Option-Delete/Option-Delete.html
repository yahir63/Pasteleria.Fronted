<div id="modalDeleteOpcion" class="modal">
  <div class="modal-content modal-content--small">
    <span id="close-delete-opcion">✕</span>
    <h2>Eliminar Opción</h2>
    <p>¿Está seguro que desea eliminar la opción <strong id="delete-opcion-nombre"></strong>?</p>
    <p style="color:#e74c3c; font-size:0.9rem;">Esta acción no se puede deshacer.</p>
    <div class="modal-actions">
      <button type="button" class="btn cancel" id="btn-cancel-delete-opcion">Cancelar</button>
      <button type="button" class="btn delete" id="btn-confirm-delete-opcion">Eliminar</button>
    </div>
  </div>
</div>

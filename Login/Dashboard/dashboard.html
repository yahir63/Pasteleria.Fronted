<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pastelería Soto</title>
    <link rel="stylesheet" href="dashboard.css">
    <link rel="stylesheet" href="/Components/global.css">
</head>

<body>

<div class="container">

    <!-- SIDEBAR GLOBAL -->
    <div id="sidebar-container"></div>
   
   

    <main class="main">


        <!-- TOPBAR GLOBAL -->
        <div id="topbar-container"></div>

        <header class="header">
            <h1>¡Bienvenido de vuelta! </h1>
            <p>Aquí tienes un resumen de tu pastelería hoy.</p>
        </header>

    
        <section class="banner">
            <div class="banner-text"></div>
        </section>

       
        <section class="cards">

          <section class="cards">

    <div class="card">
        <div class="card-icon">
            <img src="/Assets/img/pastel.png" alt="Pedidos">
        </div>
        <div class="card-info">
            <h3>Pedidos hoy</h3>
            <p class="number">24</p>
         
        </div>
    </div>

    <div class="card">
        <div class="card-icon">
            <img src="/Assets/img/carro.png" alt="Ventas">
        </div>
        <div class="card-info">
            <h3>Ventas hoy</h3>
            <p class="number">$8,560</p>
            
        </div>
    </div>

    <div class="card">
        <div class="card-icon">
            <img src="/Assets/img/caja.png" alt="Productos">
        </div>
        <div class="card-info">
            <h3>Productos</h3>
            <p class="number">56</p>
          
        </div>
    </div>

    <div class="card">
        <div class="card-icon">
            <img src="/Assets/img/avatar.png" alt="Clientes">
        </div>
        <div class="card-info">
            <h3>Clientes</h3>
            <p class="number">128</p>
        
        </div>
    </div>

</section>


</div>

<!-- JS -->
<script src="/JS/components.js"></script>

</body>
</html>

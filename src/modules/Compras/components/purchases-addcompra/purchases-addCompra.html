<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Nueva Compra</title>
<link rel="stylesheet" href="purchases-add.css" />
<link rel="stylesheet" href="/src//modules/Shared/components/global.css" />

<div class="modal modalAdd" id="modalAdd">
  <div class="modal-content">
    <div class="modal-header">
      <h2>Nueva Compra</h2>
    </div>

    <div class="modal-body">
      <section class="section">
        <h3>Información General</h3>

        <div class="header-grid">
          <div class="form-group">
            <label for="purchase-date">Fecha</label>
            <input
              type="date"
              id="purchase-date"
              name="purchase-date"
              readonly
            />
          </div>

          <div class="form-group">
            <label for="supplier">Proveedor</label>
            <select id="supplier" name="supplier"></select>
          </div>
        </div>
      </section>

      <section class="section">
        <h3>Agregar Producto</h3>

        <div class="product-grid">
          <div class="form-group">
            <label for="product">Producto</label>
            <select id="product" name="product"></select>
          </div>

          <div class="form-group">
            <label for="quantity">Cantidad</label>
            <input
              type="number"
              id="quantity"
              name="quantity"
              min="1"
              placeholder="0"
            />
          </div>

          <div class="form-group">
            <label for="unit-price"> Precio Unitario </label>
            <input
              type="number"
              id="unit-price"
              name="unit-price"
              min="0"
              step="0.01"
              placeholder="$0.00"
            />
          </div>

          <div class="button-group">
            <button type="button" class="save" id="btn-add-product">
              + Agregar
            </button>
          </div>
        </div>
      </section>

      <section class="section">
        <h3>Detalle de la Compra</h3>

        <div class="table-wrapper">
          <table>
            <thead>
              <tr>
                <th>Producto</th>
                <th>Cantidad</th>
                <th>P. Unitario</th>
                <th>Subtotal</th>
                <th>Acciones</th>
              </tr>
            </thead>

            <tbody id="details-body"></tbody>
          </table>
        </div>
      </section>
    </div>

    <div class="modal-actions">
      <div class="total-box">
        <strong>Total:</strong>

        <input type="text" id="purchase-total" value="$0.00" readonly />
      </div>

      <div class="footer-buttons">
        <button type="button" class="cancel" id="btn-cancel">Cancelar</button>

        <button type="button" class="save" id="btn-savePurchase">
          Guardar Compra
        </button>
      </div>
    </div>
  </div>
</div>

<script src="add-compra.js"></script>

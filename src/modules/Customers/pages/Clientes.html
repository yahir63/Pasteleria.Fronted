<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clientes</title>

    <link rel="stylesheet" href="/src/modules/Shared/components/global.css">
    <link rel="stylesheet" href="/src/modules/Customers/components/customer-add-modal/customer-add.css">
    <link rel="stylesheet" href="/src/modules/Customers/components/customer-edit-modal/customer-edit.css">
    <link rel="stylesheet" href="/src/modules/Customers/components/customer-delete-modal/customer-delete.css">
    <link rel="stylesheet" href="Clientes.css">
</head>

<body>

    <input type="checkbox" id="sidebar-toggle" class="sidebar-toggle">

    <label for="sidebar-toggle" class="hamburger-btn">
        <span></span>
    </label>

    <label for="sidebar-toggle" class="sidebar-overlay"></label>

    <div class="container">

        <div id="sidebar-container"></div>

        <main class="main">

            <div id="topbar-container"></div>

            <div class="header">
                <h1>Gestión de Clientes</h1>
                <p>Consulta y administra la información de tus clientes.</p>
            </div>

            <div class="card">

                <div class="top-bar">

                    <input
                        type="text"
                        placeholder="Buscar cliente..."
                    >

                    <div class="actions">

                        <select>
                            <option>Todos los clientes</option>
                        </select>

                        <button
                            id="btnNuevoCliente"
                            class="btn-new"
                            type="button"
                        >
                            <span class="icon">+</span>
                            Nuevo Cliente
                        </button>

                    </div>

                </div>

                <div class="table-wrapper">

                    <table>

                        <thead>
                            <tr>
                                <th>Nombre</th>
                                <th>Apellido</th>
                                <th>Teléfono</th>
                                <th>Cédula</th>
                                <th>Dirección</th>
                                <th>Estado</th>
                                <th>Acciones</th>
                            </tr>
                        </thead>

                        <tbody>

                            <tr>

                     

                                <td class="table-actions">

                                    <button
                                        type="button"
                                        class="edit btnEdit"
                                    >
                                        <img src="/src/modules/Shared/Assets/img/editar.png">
                                        Editar
                                    </button>

                                    <button
                                        type="button"
                                        class="delete btnDelete"
                                    >
                                        <img src="/src/modules/Shared/Assets/img/eliminar.png">
                                        Eliminar
                                    </button>

                                </td>

                            </tr>

                            <tr>

                             

                                <td class="table-actions">

                                    <button
                                        type="button"
                                        class="edit btnEdit"
                                    >
                                        <img src="/src/modules/Shared/Assets/img/editar.png">
                                        Editar
                                    </button>

                                    <button
                                        type="button"
                                        class="delete btnDelete"
                                    >
                                        <img src="/src/modules/Shared/Assets/img/eliminar.png">
                                        Eliminar
                                    </button>

                                </td>

                            </tr>

                            <tr>

                   

                                <td class="table-actions">

                                    <button
                                        type="button"
                                        class="edit btnEdit"
                                    >
                                        <img src="/src/modules/Shared/Assets/img/editar.png">
                                        Editar
                                    </button>

                                    <button
                                        type="button"
                                        class="delete btnDelete"
                                    >
                                        <img src="/src/modules/Shared/Assets/img/eliminar.png">
                                        Eliminar
                                    </button>

                                </td>

                            </tr>

                        </tbody>

                    </table>

                </div>

                <div class="table-footer">

                    <span>
                        Mostrando 1 a 3 de 25 clientes
                    </span>

                    <div class="pagination">
                        <button>&lt;</button>
                        <button class="active">1</button>
                        <button>2</button>
                        <button>3</button>
                        <button>&gt;</button>
                    </div>

                </div>

            </div>

        </main>

    </div>

    <!-- Aquí se cargarán los modales -->
    <div id="modal-container"></div>

    <script src="/src/modules/Shared/components/components.js"></script>
    <script src="/src/modules/Customers/Services/Clientes.js"></script>

</body>
</html>

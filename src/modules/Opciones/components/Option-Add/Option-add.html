<div id="modalAddOpcion" class="modal">
  <div class="modal-content">
    <span id="close-add-opcion">✕</span>
    <h2>Nueva Opción</h2>

    <label for="add-opcion-nombre">Nombre</label>
    <input type="text" id="add-opcion-nombre" placeholder="Nombre de la opción" />

    <label for="add-opcion-descripcion">Descripción</label>
    <input type="text" id="add-opcion-descripcion" placeholder="Descripción" />

    <label for="add-opcion-medida">Medida</label>
    <input type="text" id="add-opcion-medida" placeholder="Ej: kg, unidad, litro" />

    <label for="add-opcion-precio">Precio</label>
    <input type="number" id="add-opcion-precio" placeholder="0.00" min="0" step="0.01" />

    <div class="modal-actions">
      <button type="button" class="btn cancel" id="btn-cancel-add-opcion">Cancelar</button>
      <button type="button" class="btn save" id="btn-save-opcion">Guardar</button>
    </div>
  </div>
</div>

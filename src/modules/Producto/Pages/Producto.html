
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Productos</title>

    <link rel="stylesheet" href="/src/modules/Shared/components/global.css">
   <link rel="stylesheet" href="/src/modules/Producto/components/product-add-modal/producto-add.css">
   <link rel="stylesheet" href="/src/modules/Producto/components/producto-edit-modal/producto-edit.css">
   <link rel="stylesheet" href="/src/modules/Producto/components/product-delete-modal/producto-delete.css">

    <link rel="stylesheet" href="/src/modules/Producto/Pages/Producto.css">
</head>

<body>

   
    <input type="checkbox" id="sidebar-toggle" class="sidebar-toggle">

    <label for="sidebar-toggle" class="hamburger-btn">
        <span></span>
    </label>

    <label for="sidebar-toggle" class="sidebar-overlay"></label>

    <div class="container">

       
        <div id="sidebar-container"></div>

     
        <main class="main">

  
            <div id="topbar-container"></div>

            
            <div class="header">
                <h1>Gestión de Productos</h1>
                <p>Consulta y administra la información de tus productos.</p>
            </div>

           
            <div class="card">

                <div class="top-bar">

                    <input
                        type="text"
                        placeholder="Buscar producto..."
                    >

                    <div class="actions">

                        <select id="filtroEstado">
                            <option value="">Todos los productos</option>
                            <option value="true">Activos</option>
                            <option value="false">Inactivos</option>
                        </select>

                        <button
                            id="btnNuevoProducto"
                            class="btn-new"
                            type="button"
                        >
                            <span class="icon">+</span>
                            Nuevo Producto
                        </button>

                    </div>

                </div>

                <div class="table-wrapper">

                    <table>

                        <thead>
                            <tr>
                                <th>Nombre</th>
                                <th>Descripción</th>
                                <th>Categoría</th>
                                <th>Proveedor</th>
                                <th>Estado</th>
                                <th>Acciones</th>
                            </tr>
                        </thead>

                        <tbody>

                            <tr>
                                <td></td>
                                <td></td>
                                <td></td>
                                <td></td>
                                <td></td>

                                <td class="table-actions">

                                    <button
                                        type="button"
                                        class="edit btnEdit"
                                    >
                                        <img src="/src/modules/Shared/Assets/img/editar.png" alt="Editar">
                                        Editar
                                    </button>

                                    <button
                                        type="button"
                                        class="delete btnDelete"
                                    >
                                        <img src="/src/modules/Shared/Assets/img/eliminar.png" alt="Cambiar estado">
                                        Cambiar Estado
                                    </button>

                                </td>
                            </tr>

                            <tr>
                                <td></td>
                                <td></td>
                                <td></td>
                                <td></td>
                                <td></td>

                                <td class="table-actions">

                                    <button
                                        type="button"
                                        class="edit btnEdit"
                                    >
                                        <img src="/src/modules/Shared/Assets/img/editar.png" alt="Editar">
                                        Editar
                                    </button>

                                    <button
                                        type="button"
                                        class="delete btnDelete"
                                    >
                                        <img src="/src/modules/Shared/Assets/img/eliminar.png" alt="Cambiar estado">
                                        Cambiar Estado
                                    </button>

                                </td>
                            </tr>

                            <tr>
                                <td></td>
                                <td></td>
                                <td></td>
                                <td></td>
                                <td></td>

                                <td class="table-actions">

                                    <button
                                        type="button"
                                        class="edit btnEdit"
                                    >
                                        <img src="/src/modules/Shared/Assets/img/editar.png" alt="Editar">
                                        Editar
                                    </button>

                                    <button
                                        type="button"
                                        class="delete btnDelete"
                                    >
                                        <img src="/src/modules/Shared/Assets/img/eliminar.png" alt="Cambiar estado">
                                        Cambiar Estado
                                    </button>

                                </td>
                            </tr>

                        </tbody>

                    </table>

                </div>

                
                <div class="table-footer">

                    <span>
                        Mostrando 1 a 3 de 25 productos
                    </span>

                    <div class="pagination">
                        <button>&lt;</button>
                        <button class="active">1</button>
                        <button>2</button>
                        <button>3</button>
                        <button>&gt;</button>
                    </div>

                </div>

            </div>

        </main>

    </div>

    
    <div id="modal-container"></div>

    
    <script src="/src/modules/Shared/components/components.js"></script>
    <script type="module" src="/src/modules/Producto/Pages/Producto.js"></script>

</body>

</html>

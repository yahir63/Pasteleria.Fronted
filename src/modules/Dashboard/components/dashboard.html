<link rel="stylesheet" href="/src/modules/Dashboard/components/dashboard.css" />

<header class="header">
  <h1>¡Bienvenido de vuelta!</h1>
  <p>Aquí tienes un resumen de tu pastelería hoy.</p>
</header>

<section class="dashboard-top">
  <div class="banner-wrapper">
    <section class="banner">
      <div class="banner-text"></div>
    </section>
  </div>

  <aside class="widgets-panel">
    <div class="widget-card">
      <div class="widget-header">
        <h3>
          <img src="/src/modules/Shared/Assets/img/pastel.png" alt="pedidos" style="width: 18px; vertical-align: middle" />
          Pedidos de hoy
        </h3>
        <span class="widget-badge">3 activos</span>
      </div>
      <ul class="widget-list">
        <li class="widget-item">
          <span class="item-dot dot-blue"></span>
          <span class="item-name">Pastel de chocolate</span>
          <span class="item-time">14:00</span>
        </li>
        <li class="widget-item">
          <span class="item-dot dot-orange"></span>
          <span class="item-name">Cupcakes x24</span>
          <span class="item-time">16:30</span>
        </li>
        <li class="widget-item">
          <span class="item-dot dot-green"></span>
          <span class="item-name">Tarta de frutas</span>
          <span class="item-time">18:00</span>
        </li>
      </ul>
    </div>

    <div class="widget-card">
      <div class="widget-header">
        <h3>
          <img src="/src/modules/Shared/Assets/img/carro.png" alt="ventas" style="width: 18px; vertical-align: middle" />
          Meta de ventas
        </h3>
      </div>
      <div class="widget-progress">
        <div class="progress-row">
          <div class="progress-label">
            <span>Hoy</span><strong>$8,560</strong>
          </div>
          <div class="progress-bg">
            <div class="progress-fill" style="width: 72%"></div>
          </div>
        </div>
        <div class="progress-row">
          <div class="progress-label">
            <span>Semana</span><strong>$32,400</strong>
          </div>
          <div class="progress-bg">
            <div class="progress-fill fill-green" style="width: 65%"></div>
          </div>
        </div>
      </div>
    </div>
  </aside>
</section>

<section class="cards">
  <div class="card">
    <div class="card-icon">
      <img src="/src/modules/Shared/Assets/img/pastel.png" alt="Pedidos" />
    </div>
    <div class="card-info">
      <h3>Pedidos hoy</h3>
      <p class="number">24</p>
    </div>
  </div>
  <div class="card">
    <div class="card-icon">
      <img src="/src/modules/Shared/Assets/img/carro.png" alt="Ventas" />
    </div>
    <div class="card-info">
      <h3>Ventas hoy</h3>
      <p class="number">$8,560</p>
    </div>
  </div>
  <div class="card">
    <div class="card-icon">
      <img src="/src/modules/Shared/Assets/img/caja.png" alt="Productos" />
    </div>
    <div class="card-info">
      <h3>Productos</h3>
      <p class="number">56</p>
    </div>
  </div>
  <div class="card">
    <div class="card-icon">
      <img src="/src/modules/Shared/Assets/img/avatar.png" alt="Clientes" />
    </div>
    <div class="card-info">
      <h3>Clientes</h3>
      <p class="number">128</p>
    </div>
  </div>
</section>

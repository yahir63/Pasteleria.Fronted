<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Configuracion</title>
    <link rel="stylesheet" href="Configuracion.css">
    <link rel="stylesheet" href="/Components/global.css">
</head>

<body class="configuracion">

<div class="container">

    <!-- SIDEBAR GLOBAL -->
    <div id="sidebar-container"></div>

    <!-- MAIN -->
    <main class="main-content">

        <!-- TOPBAR GLOBAL -->
        <div id="topbar-container"></div>

        <!-- GRID -->
        <section class="grid-secundario">

            <!-- DATOS DEL SISTEMA -->
            <div class="card">
                <span>
                    <img src="/Assets/img/engranaje.png" class="icon-card" alt="">
                    Datos del sistema
                </span>

                <div class="item">
                    <span>Nombre</span>
                    <input type="text" value="Admin Soto">
                </div>

                <div class="item">
                    <span>Administrador</span>
                    <input type="text" value="Sasha Ramirez">
                </div>

                <div class="item">
                    <span>Correo</span>
                    <input type="email" value="admin@soto.com">
                </div>

                <div class="item">
                    <span>Idioma</span>
                    <input type="text" value="Español">
                </div>

                <button class="btn-save">
                    Guardar cambios
                </button>
            </div>

            <!-- SEGURIDAD -->
            <div class="card">
                <span>
                    <img src="/Assets/img/candado.png" class="icon-card" alt="">
                    Seguridad
                </span>

                <div class="item">
                    <span>Contraseña actual</span>
                    <input type="password">
                </div>

                <div class="item">
                    <span>Nueva contraseña</span>
                    <input type="password">
                </div>

                <div class="item">
                    <span>Confirmar</span>
                    <input type="password">
                </div>

                <button class="btn-save">
                    Actualizar
                </button>
            </div>

            <!-- APARIENCIA -->
            <div class="card">
                <span>
                    <img src="/Assets/img/paleta-de-color.png" class="icon-card" alt="">
                    Apariencia
                </span>

                <div class="item">
                    <span>Modo oscuro</span>

                    <button 
                        class="btn-save"
                        onclick="document.body.classList.toggle('dark-mode')">

                        <img src="/Assets/img/luna.png" class="icon-card" alt="">
                        Modo Oscuro
                    </button>
                </div>

                <div class="item">
                    <span>Tamaño letra</span>
                    <input type="text" value="Mediano">
                </div>
            </div>

            <!-- SISTEMA -->
            <div class="card">
                <span>
                    <img src="/Assets/img/inmune.png" class="icon-card" alt="">
                    Sistema
                </span>

                <div class="item">
                    <span>Notificaciones</span>
                    <input type="text" value="Activadas">
                </div>

                <div class="item">
                    <span>Estado</span>
                    <input type="text" value="Activo">
                </div>
            </div>

        </section>

    </main>

</div>
<!-- JS -->
<script src="/JS/components.js"></script>

</body>
</html>

<div id="modalViewDetalle" class="modal">
  <div class="modal-content">
    <span id="close-view-Detalle" class="close">&times;</span>
    <h2 class="view-title">Detalle del Pedido</h2>

    <div class="view-info-group">
      <div class="view-info-item">
        <span class="view-label">Cliente</span>
        <span id="view-cliente" class="view-value"></span>
      </div>
      <div class="view-info-item">
        <span class="view-label">Fecha Inicio</span>
        <span id="view-fecha" class="view-value"></span>
      </div>
      <div class="view-info-item">
        <span class="view-label">Fecha Entrega</span>
        <span id="view-time-delivery" class="view-value"></span>
      </div>
      <div class="view-info-item">
        <span class="view-label">Estado</span>
        <span id="view-estado" class="view-value"></span>
      </div>
    </div>

    <table class="tabla-detalles">
      <thead>
        <tr>
          <th>Producto</th>
          <th>Cantidad</th>
          <th>Volumen</th>
          <th>Precio Unit.</th>
          <th>Subtotal</th>
        </tr>
      </thead>
      <tbody id="view-details-body"></tbody>
    </table>

    <div class="view-totales">
      <div class="view-total-item">
        <span class="view-label">Total (100%)</span>
        <span id="view-total" class="view-value"></span>
      </div>
      <div class="view-total-item adelanto">
        <span class="view-label">Adelanto (50%)</span>
        <span id="view-adelanto" class="view-value"></span>
      </div>
    </div>

    <button type="button" id="btn-close-view">Cerrar</button>
  </div>
</div>

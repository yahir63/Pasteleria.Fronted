<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/src/modules/Shared/components/global.css">
    <link rel="stylesheet" href="/src/modules/Producto/components/product-add-modal/product-add.css">
    <title>Modal-add-product</title>
</head>
<body>

    <div id="modalAdd" class="modal">
        <div class="modal-content">

            <h2>Nuevo Producto</h2>

            <input type="text" id="addNombre" placeholder="Nombre del producto">

            <input type="number" id="addCategoria" placeholder="ID de Categoría">

            <input type="number" id="addProveedor" placeholder="ID de Proveedor">

            <input type="text" id="addDescripcion" placeholder="Descripción">

            <div class="modal-actions">
                <button class="btn cancel closeModal">Cancelar</button>
                <button class="btn save">Guardar</button>
            </div>

        </div>
    </div>

</body>
</html>

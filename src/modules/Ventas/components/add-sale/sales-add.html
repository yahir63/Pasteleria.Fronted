<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Nueva Venta</title>
<link rel="stylesheet" href="sales-add.css" />
<link rel="stylesheet" href="/src/modules/Shared/components/global.css" />

<div class="modal modalAdd" id="modalAdd">
  <div class="modal-content">
    <div class="modal-header">
      <h2>Nueva Venta</h2>
    </div>

    <div class="modal-body">
      <section class="section">
        <h3>Información General</h3>

        <div class="header-grid">
          <div class="form-group">
            <label for="sale-date">Fecha</label>
            <input type="date" id="sale-date" name="sale-date" readonly />
          </div>

          <div class="form-group">
            <label for="customer">Cliente</label>
            <select id="customer" name="customer"></select>
          </div>
        </div>
      </section>

      <section class="section">
        <h3>Agregar Producto</h3>

        <div class="product-grid">
          <div class="form-group">
            <label for="product">Producto</label>
            <select id="product" name="product"></select>
          </div>

          <div class="form-group">
            <label for="quantity">Cantidad</label>
            <input
              type="number"
              id="quantity"
              name="quantity"
              min="1"
              placeholder="0"
            />
          </div>

          <div class="button-group">
            <button type="button" class="save" id="btn-add-product">
              + Agregar
            </button>
          </div>
        </div>
      </section>

      <section class="section">
        <h3>Detalle de la Venta</h3>

        <div class="table-wrapper">
          <table>
            <thead>
              <tr>
                <th>Producto</th>
                <th>Cantidad</th>
                <th>Precio</th>
                <th>Subtotal</th>
                <th>Acciones</th>
              </tr>
            </thead>

            <tbody id="details-body"></tbody>
          </table>
        </div>
      </section>
    </div>

    <div class="modal-actions">
      <div class="total-box">
        <strong>Total:</strong>
        <input type="text" id="sale-total" value="0" readonly />
      </div>

      <div class="footer-buttons">
        <button type="button" class="cancel" id="btn-cancel">Cancelar</button>
        <button type="button" class="save" id="btn-saveSale">
          Guardar Venta
        </button>
      </div>
    </div>
  </div>
</div>

<script src="sales-add.js"></script>
